<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Hiragana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-style-default">
    <div class="page-shell">
        <h1>ひらがな <span>(Hiragana)</span></h1>

        <div id="selection-panel">
            <div id="table" aria-label="Hiragana table"></div>
            <div id="supplemental-tables"></div>

            <div class="table-actions">
                <button id="select-all" type="button">Zaznacz wszystko</button>
                <button id="clear-all" type="button">Wyczyść wszystko</button>
            </div>

            <button id="start">Rozpocznij naukę</button>
            <div class="reading-practice-controls">
                <button id="start-reading-practice" type="button">Ćwicz czytanie tekstu</button>
                <div id="reading-story-picker" class="reading-story-picker">
                    <label for="reading-story">Historia:</label>
                    <select id="reading-story"></select>
                    <div id="reading-foreign-names-picker" class="reading-foreign-names-picker" hidden>
                        <label for="reading-foreign-name-script">Wyrazy obce:</label>
                        <select id="reading-foreign-name-script">
                            <option value="hiragana">Hiragana</option>
                            <option value="katakana">Katakana</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <hr>

        <section id="reading-practice" class="reading-practice" aria-labelledby="reading-title" hidden>
            <h2 id="reading-title">Czytanie: Momotarō</h2>
            <p class="reading-disclaimer">
                Pamiętaj: は jako partykuła czyta się „wa”, へ — „e”, a を — „o”.
                Partykuły są pogrubione w tekście.
            </p>

            <div id="reading-active">
                <p id="reading-progress" aria-live="polite"></p>
                <div id="reading-line" class="reading-line" lang="ja"></div>
                <label for="reading-answer">Wpisz rōmaji tej linijki:</label>
                <input id="reading-answer" autocomplete="off" spellcheck="false">
                <p id="reading-feedback" role="status" aria-live="polite"></p>
                <button id="reading-submit" type="button">Dalej</button>
                <button id="reading-cancel" type="button">Zakończ czytanie</button>
            </div>

            <div id="reading-results" hidden>
                <h3 id="reading-results-title">Cały tekst</h3>
                <p id="reading-score"></p>
                <div id="reading-result-lines" lang="ja"></div>
                <p id="reading-source" class="reading-source"></p>
                <section class="reading-translation" aria-labelledby="reading-translation-title">
                    <h3 id="reading-translation-title">Tłumaczenie na polski</h3>
                    <p id="reading-translation" lang="pl"></p>
                </section>
                <button id="reading-repeat-chapter" type="button">Powtórz rozdział</button>
                <button id="reading-next-chapter" type="button">Przeczytaj następny rozdział</button>
                <button id="reading-back" type="button">Wróć do tabeli</button>
            </div>
        </section>

        <hr id="reading-divider" hidden>

        <div id="app" style="display:none;">
            <div id="char-box"></div>

            <input id="answer" placeholder="Podaj rōmaji" autocomplete="off" spellcheck="false">
            <button id="submit" type="button">Sprawdź</button>
            <button id="end-study" type="button">Zakończ naukę</button>
            <button id="repeat-study" type="button" style="display:none;">Powtórz</button>
            <button id="repeat-mistakes-study" type="button" style="display:none;">Powtórz tylko pomyłki</button>

            <div id="feedback"></div>

            <button id="continue" style="display:none;">Dalej</button>

            <hr>

            <button id="save">Zapisz postęp</button>
            <button id="load">Wczytaj postęp</button>
            <input type="file" id="fileInput" style="display:none;">
        </div>

        <div class="font-picker">
            <label for="font-style">Styl czcionki</label>
            <select id="font-style">
                <option value="default" selected>Domyślny</option>
                <option value="brush">Pędzel</option>
                <option value="elegant">Elegancki</option>
                <option value="modern">Nowoczesny</option>
            </select>
        </div>

        <div class="font-picker alphabet-picker">
            <label for="alphabet-type">Alfabet</label>
            <select id="alphabet-type">
                <option value="hiragana" selected>Hiragana</option>
                <option value="katakana">Katakana</option>
            </select>
        </div>

        <div class="font-picker">
            <label id="extended-kana-label" for="extended-kana">Kana rozszerzone (ゐ wi, ゑ we)</label>
            <input id="extended-kana" type="checkbox">
        </div>

        <div class="font-picker">
            <a href="other-alphabets.html" class="nav-link">Inne alfabety</a>
            <a href="kanji.html" class="nav-link">Otwórz trening Kanji</a>
            <a href="kurrent.html" class="nav-link">Trening Kurrent</a>
            <a href="german.html" class="nav-link">Niemieckie słownictwo</a>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="alphabets-common.js"></script>
    <script src="reading-vocabulary-data.js"></script>
    <script src="kana-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
