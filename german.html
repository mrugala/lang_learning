<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Niemieckie słownictwo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2b2b'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23f8f9ea'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body class="font-style-default">
    <div class="page-shell">
        <h1>Deutsch <span>(niemieckie słownictwo)</span></h1>

        <div id="selection-panel">
            <div class="study-mode-panel">
                <div class="study-mode-pair">
                    <label for="translation-direction">Kierunek:</label>
                    <select id="translation-direction">
                        <option value="de-pl">niemiecki → polski</option>
                        <option value="pl-de">polski → niemiecki</option>
                        <option value="mixed">oba kierunki — wymieszane</option>
                    </select>
                </div>
            </div>

            <div id="vocabulary-categories" class="deck-grid" aria-label="Kategorie słownictwa"></div>

            <div class="table-actions">
                <button id="select-all-categories" type="button">Zaznacz wszystkie kategorie</button>
                <button id="clear-all-categories" type="button">Wyczyść wybór</button>
            </div>

            <button id="start" type="button">Rozpocznij naukę</button>
        </div>

        <hr>

        <div id="app" style="display:none;">
            <div id="char-box"></div>
            <div id="queue-counter" class="queue-counter" aria-live="polite"></div>
            <input id="vocabulary-answer" placeholder="Podaj tłumaczenie" autocomplete="off" spellcheck="false">
            <div id="german-characters" class="character-buttons" aria-label="Znaki niemieckie" style="display:none;">
                <button type="button" data-character="ä">ä</button>
                <button type="button" data-character="ö">ö</button>
                <button type="button" data-character="ü">ü</button>
                <button type="button" data-character="ß">ß</button>
                <button type="button" data-character="Ä">Ä</button>
                <button type="button" data-character="Ö">Ö</button>
                <button type="button" data-character="Ü">Ü</button>
            </div>
            <button id="submit" type="button">Sprawdź</button>
            <button id="end-study" type="button">Zakończ naukę</button>
            <button id="repeat-study" type="button" style="display:none;">Powtórz</button>
            <button id="repeat-mistakes-study" type="button" style="display:none;">Powtórz tylko pomyłki</button>
            <div id="feedback" role="status" aria-live="polite"></div>
            <button id="continue" type="button" style="display:none;">Dalej</button>
        </div>

        <div class="font-picker">
            <a href="index.html" class="nav-link">Hiragana i katakana</a>
            <a href="other-alphabets.html" class="nav-link">Inne alfabety</a>
            <a href="kanji.html" class="nav-link">Trening Kanji</a>
            <a href="kurrent.html" class="nav-link">Trening Kurrent</a>
            <a href="flashcards.html" class="nav-link">Fiszki</a>
        </div>
    </div>

    <script src="german-vocabulary-data.js"></script>
    <script src="common.js"></script>
    <script src="german-vocabulary.js"></script>
</body>
</html>
